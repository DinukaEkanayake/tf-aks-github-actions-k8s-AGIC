apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretProviderClass.name }}
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "{{ .Values.azure.managedIdentityClientId }}" # Set the clientID of the user-assigned managed identity.Replace with output from Terraform
    keyvaultName: "{{ .Values.azure.keyVaultName }}"
    objects: |
      array:
        - |
          objectName: mysql-admin-login
          objectType: secret
          objectVersion: ""
    tenantId: "{{ .Values.azure.tenantId }}" # Replace with your Azure tenant ID

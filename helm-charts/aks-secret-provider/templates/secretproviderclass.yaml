  #     type: Opaque
  #     data:
  #       - objectName: mysql-admin-password
  #         key: password
  #       - objectName: mysql-admin-login
  #         key: username
    # object types are secret, key, or cert

    # - |
    #       objectName: mysql-admin-password
    #       objectType: secret
    #       objectVersion: ""
  
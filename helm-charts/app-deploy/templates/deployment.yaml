apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: default
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      serviceAccountName: workloadidentity-sa
      containers:
      - name: myapp-image
        image: "imgmyappacrregistry.azurecr.io/myrepository/springbootapp:latest"
        ports:
        - containerPort: 80
          protocol: TCP
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysqldbserver-myapptestakscluster.mysql.database.azure.com:3306/myappdb?useSSL=true&requireSSL=false"
        - name: DATABASE_USERNAME
          value: "mysqladmin"
        - name: DATABASE_PASSWORD
          value: "Dinuka18"
        - name: DATABASE_NAME
          value: "myappdb"
          # - name: APP-ENV
          #   valueFrom: 
          #     configMapKeyRef:
          #       name: myapp-config
          #       key: APP_ENV
          # - name: SPRING_DATASOURCE_URL
          #   valueFrom:
          #     configMapKeyRef:
          #       name: myapp-config
          #       key: SPRING_DATASOURCE_URL
          # - name: DATABASE_HOST
          #   valueFrom:
          #     configMapKeyRef:
          #       name: myapp
          #       key: DATABASE_HOST
          # - name: DATABASE_PORT
          #   valueFrom:
          #     configMapKeyRef:
          #       name: myapp
          #       key: DATABASE_PORT
          # - name: SSL_MODE
          #   valueFrom:
          #     configMapKeyRef:
          #       name: myapp
          #       key: ssl-mode
          # - name: DATABASE_NAME
          #   valueFrom:
          #     configMapKeyRef:
          #       name: myapp
          #       key: DATABASE_NAME
          # - name: DATABASE_USERNAME
          #   valueFrom:
          #     secretKeyRef:
          #       name: myapp-secret
          #       key: username
          # - name: DATABASE_PASSWORD
          #   valueFrom:
          #     secretKeyRef:
          #       name: myapp-secret
          #       key: password
        volumeMounts:
          - name: application-data
            mountPath: /config
          - name: secrets-store
            mountPath: "/mnt/secrets-store"
            readOnly: true
        resources:
          requests: #Minimum resources required for the container to start
            cpu: 10m
            memory: 128Mi
          limits: #Maximum resources the container can consume.
            cpu: 250m
            memory: 256Mi
      volumes:
      - name: application-data
        configMap:
          name: myapp
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kvname-user-msi" #This mounts the secret from Key Vault to /mnt/secrets-store
      # - name: azure-storage #A PVC ensures data persists across Pod restarts, deletions, and rescheduling.
      #   persistentVolumeClaim: #If a Pod crashes or restarts, any data inside its container is lost.
      #     claimName: myapp #PVC Requests for storage by a Pod.PV is a Physical storage